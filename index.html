<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin Gan | Engineering Portfolio</title>
    <link rel="icon" type="image/x-icon" href="/src/assets/avatar.svg" />
    <meta
      name="description"
      content="Software, data, and applied computing projects by Emory University Mathematics and Computer Science student Kevin Gan."
    />
    <meta property="og:title" content="Kevin Gan | Engineering Portfolio" />
    <meta
      property="og:description"
      content="Software, data, and applied computing projects by Emory University Mathematics and Computer Science student Kevin Gan."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f7f8fa" />
    <script>
      (() => {
        const storedMode = window.localStorage.getItem('color-mode');
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches;
        const useDarkMode =
          storedMode === 'dark' || (storedMode === null && prefersDark);
        document.documentElement.classList.toggle('dark', useDarkMode);
        document.documentElement.style.colorScheme = useDarkMode
          ? 'dark'
          : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
